name: Existing Vercel production deployment

on:
  workflow_dispatch:
    inputs:
      inference_mode:
        description: Existing production requires the approved inference release
        required: true
        default: approved_release
        type: choice
        options:
          - approved_release
      release_id:
        description: Approved immutable production model release
        required: true
        default: nlp-online-original-v2
        type: string
      nlp_runtime:
        description: Selected classifier; RF requires explicit retrained_rf release approval
        required: true
        default: retrained_rf
        type: choice
        options:
          - retrained_rf
      deploy_approved:
        description: Owner authorizes this exact commit/release for the existing production project
        required: true
        default: false
        type: boolean
      database_upgrades_ready:
        description: Owner confirms reviewed account, live-revision and document-processing SQL/grants are installed on the existing project
        required: true
        default: false
        type: boolean
      revised_workflow:
        description: Stage Option B using a deployment-only capability; exact-host SQL approval is still required afterward
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: existing-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.deploy_approved }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      PSMS_NLP_RUNTIME: ${{ inputs.nlp_runtime }}
      RELEASE_ID: ${{ inputs.release_id }}
      INFERENCE_MODE: ${{ inputs.inference_mode }}
      DATABASE_UPGRADES_READY: ${{ inputs.database_upgrades_ready }}
    steps:
      - name: Reject incompatible production inputs before checkout or deployment
        run: |
          test "$INFERENCE_MODE" = approved_release
          test "$PSMS_NLP_RUNTIME" = retrained_rf
          test "$RELEASE_ID" = nlp-online-original-v2
          test "$DATABASE_UPGRADES_READY" = true
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare source-only context below 90 MB with explicit inference mode
        run: python -B deploy/online_delivery.py context --production --inference-mode "$INFERENCE_MODE" --release "$RELEASE_ID" --runtime "$PSMS_NLP_RUNTIME" --output output/vercel-container
      - name: Deploy the prepared context to the existing project
        working-directory: output/vercel-container
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # These override ONLY this immutable deployment, never project settings.
          PSMS_PROCUREMENT_RELEASE: ${{ inputs.revised_workflow && 'revised-procurement-v1' || '' }}
          PSMS_PROCUREMENT_RELEASE_TOKEN: ${{ inputs.revised_workflow && secrets.PSMS_PROCUREMENT_RELEASE_TOKEN || '' }}
        run: |
          test "$VERCEL_ORG_ID" = team_bFH3r8Oox6gO7JGEDQ1YZtU1
          test "$VERCEL_PROJECT_ID" = prj_WuHbP7ztALH56NUyLCy1e6exvgs4
          test -n "$VERCEL_TOKEN"
          python - <<'PY'
          import os, re
          release = os.environ.get('PSMS_PROCUREMENT_RELEASE', '')
          token = os.environ.get('PSMS_PROCUREMENT_RELEASE_TOKEN', '')
          if release:
              if release != 'revised-procurement-v1' or not re.fullmatch('[0-9a-f]{64}', token):
                  raise SystemExit('Valid deployment-only Option B secret required; no deployment attempted.')
          elif token:
              raise SystemExit('A capability without its release is not allowed.')
          PY
          # Bare --env names read server-side values from this step's environment.
          # No token value enters argv, source files or project-wide configuration.
          npx --yes vercel@latest deploy --prod --yes \
            --env PSMS_PROCUREMENT_RELEASE --env PSMS_PROCUREMENT_RELEASE_TOKEN
