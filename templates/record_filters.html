{% if record_pagination and active!='inventory' %}<section class="card record-filter-bar"><form method="get"><input type="hidden" name="_nav" value="{{navigation_token()}}"><label>Find records<input name="q" type="search" value="{{request.args.get('q','')}}" maxlength="160" placeholder="Document, item or reference"></label><label>Status<input name="status" value="{{request.args.get('status','')}}" maxlength="60" placeholder="All statuses"></label><label>Sort<select name="sort">{% for value,label in [('newest','Newest'),('oldest','Oldest'),('number','Reference A–Z'),('number_desc','Reference Z–A'),('status','Status')] %}<option value="{{value}}" {{'selected' if request.args.get('sort','newest')==value}}>{{label}}</option>{% endfor %}</select></label>{% for key in ['category','sheet','comparison_po_id','ocr_source'] if key in request.args %}<input type="hidden" name="{{key}}" value="{{request.args[key]}}">{% endfor %}<button class="btn" type="submit">Apply</button></form></section>{% endif %}
