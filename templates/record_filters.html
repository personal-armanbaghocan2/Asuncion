{% if record_pagination and active not in ['inventory','users'] %}
<section class="card record-filter-bar" aria-label="Record search and filters">
<form method="get" data-auto-filters data-record-navigation><input type="hidden" name="_nav" value="{{navigation_token()}}">
<label>Find records<input name="q" type="search" value="{{request.args.get('q','')}}" maxlength="160" placeholder="Document, item, supplier or linked reference"></label>
{% if active!='audit' %}<label>Status<input name="status" value="{{request.args.get('status','')}}" maxlength="60" placeholder="All statuses"></label>{% endif %}
<label>Record year<input name="year" type="number" min="1900" max="2199" step="1" value="{{request.args.get('year','')}}" placeholder="All years" aria-label="Filter records by fiscal or document year"></label>
<label>Sort<select name="sort">{% for value,label in [('newest','Newest'),('oldest','Oldest'),('number','Reference A–Z'),('number_desc','Reference Z–A'),('status','Status')] if value!='status' or active!='audit' %}<option value="{{value}}" {{'selected' if request.args.get('sort','newest')==value}}>{{label}}</option>{% endfor %}</select></label>
{% for key,value in request.args.items() if key in ['category','sheet','comparison_po_id','ocr_source','pr_id','po_id','draft_id'] or key.startswith('h_') %}<input type="hidden" name="{{key}}" value="{{value}}">{% endfor %}
<button class="btn" type="submit" data-auto-filter-submit>Apply</button><a class="btn" href="{{pagination_url(1,q='',status='',year='',sort='newest')}}">Clear filters</a>
</form></section>{% endif %}
